<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">DualCount publication illustration</title>
  <desc id="desc">An abstract diagram showing density and point representations being combined for object counting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4ef"/>
      <stop offset="1" stop-color="#e8ddd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="105" cy="82" r="120" fill="#cfe1d3" opacity=".75"/>
  <circle cx="720" cy="440" r="155" fill="#e0cdb9" opacity=".62"/>

  <g filter="url(#shadow)">
    <rect x="70" y="128" width="235" height="238" rx="22" fill="#fff" opacity=".96"/>
    <text x="104" y="175" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276749">DENSITY</text>
    <g fill="#79a784" opacity=".82">
      <circle cx="130" cy="235" r="35"/><circle cx="202" cy="220" r="46"/><circle cx="250" cy="276" r="41"/>
      <circle cx="158" cy="304" r="43"/><circle cx="232" cy="326" r="30"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="495" y="128" width="235" height="238" rx="22" fill="#fff" opacity=".96"/>
    <text x="531" y="175" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#8b6543">POINTS</text>
    <g fill="#9c7049">
      <circle cx="552" cy="228" r="10"/><circle cx="620" cy="211" r="10"/><circle cx="672" cy="257" r="10"/>
      <circle cx="565" cy="304" r="10"/><circle cx="639" cy="328" r="10"/><circle cx="687" cy="301" r="10"/>
    </g>
    <g stroke="#c29b78" stroke-width="2" opacity=".65">
      <path d="M552 228L620 211L672 257L687 301L639 328L565 304Z" fill="none"/>
    </g>
  </g>

  <path d="M324 247H476" stroke="#276749" stroke-width="8" stroke-linecap="round"/>
  <path d="M448 219L480 247L448 275" fill="none" stroke="#276749" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="247" r="39" fill="#276749"/>
  <text x="400" y="257" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#fff">+</text>

  <text x="400" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="43" fill="#171713">DualCount</text>
  <text x="400" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#65645d">Structurally consistent zero-shot object counting</text>
</svg>
